# Dataset v2: LPC characters at 64x64 with the decision-0014 sampling fixes
# (cyclops eyes rare, whole shields only, no lone trim overlays).
name = "lpc64v2"
source = "lpc"
size = 64
characters = 20000              # train + validation + test
seed = 2
licenses = "permissive"         # CC0 / CC-BY / OGA-BY only; see docs/decisions 0002

[splits]
validation = 0.03
test = 0.03
unseen_items = 0.05
unseen_characters = 1000

[source_options]
root = "data/raw/lpc"
