# Main model: copy by position, iterative (MaskGIT-style) decoding.
model = "copy_animator"
dataset = "lpc32"

[model_options]
channels = [32, 64, 128, 128]   # frame decoder
ref_channels = [32, 64, 128]    # reference encoder
cond_dim = 128
dim = 64                         # key/query size for copy attention
frame_heads = 4
full_mask_prob = 0.25            # share of training frames with nothing given (one-shot practice)
steps = 8                        # default decoding rounds; 1 = one-shot

[train]
device = "auto"
amp = "bf16"
# 16 examples per step so training fits comfortably on a 16 GB Mac (32 per step
# needed ~7 GB). 40000 steps x 16 = the same 640k examples A and B saw.
batch_characters = 4
per_character = 4
steps = 40000
lr = 3e-4
warmup = 1000
seed = 1
workers = 2
log_every = 100
val_every = 2000
mps_memory_fraction = 0.6
