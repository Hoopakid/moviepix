# Phase 2, experiment E1: does style augmentation alone fix out-of-style sprites?
# Identical to c32v2_new (same recipe, budget and characters: lpc32v3 = lpc32v2 + part
# maps) except: augment = 0.5 and subsample = 0.25 (data/augment.py, phase2-design.md).
# Compare against c32v2_new on LPC validation/unseen and on scripts/oos_walk.py.
model = "copy_animator"
dataset = "lpc32v3"

[model_options]
channels = [32, 64, 128, 128]
ref_channels = [32, 64, 128]
cond_dim = 128
dim = 64
frame_heads = 4
full_mask_prob = 0.25
self_cond_prob = 0.4
alpha_head = true
steps = 4
loss_chunk = 32

[train]
device = "auto"
amp = "bf16"
batch_characters = 4
per_character = 4
steps = 40000
lr = 3e-4
warmup = 1000
seed = 1
workers = 2
cpu_threads = 2            # leave CPU cores for other work
log_every = 100
val_every = 2000
mps_memory_fraction = 0.5
augment = 0.5              # share of characters given 1-3 style transforms
subsample = 0.25           # share of walk/run examples cut to 3-4 frames
