# Phase 2, experiment E3: E1b settings + about 10% real CC0 packs in other styles.
# Pass marks: docs/research/phase2-design.md (frozen 2026-11-26). Run with seeds 1 and 2.
model = "copy_animator"
dataset = "lpc32v3"

[model_options]
channels = [32, 64, 128, 128]
ref_channels = [32, 64, 128]
cond_dim = 128
dim = 64
frame_heads = 4
full_mask_prob = 0.25
self_cond_prob = 0.4
alpha_head = true
steps = 4
loss_chunk = 32

[train]
device = "auto"
amp = "bf16"
batch_characters = 4
per_character = 4
steps = 40000
lr = 3e-4
warmup = 1000
seed = 1
workers = 2
cpu_threads = 2            # leave CPU cores for other work
log_every = 100
val_every = 2000
mps_memory_fraction = 0.5
augment = 0.25             # E1 used 0.5 and lost 3.4 pts on LPC validation
augment_gentle = true      # no chibi x1.75, no size 0.5
subsample = 0.25           # share of walk/run examples cut to 3-4 frames
extra_dataset = "packs32"  # real packs; artists checked by data/heldout.py
extra_share = 0.1          # share of training characters drawn from the packs
